  <line x1="30" y1="266" x2="270" y2="266" stroke="#e0a400" stroke-opacity=".5"/>
  <text x="30" y="292" class="efeito">Para cada vítima, acha a captura</text><text x="30" y="311" class="efeito">arquivada mais próxima da compra e</text><text x="30" y="330" class="efeito">mede as lacunas sem prova.</text>
  <text x="150" y="384" class="rod" text-anchor="middle">ARCO III · DESAFIO</text>
  <text x="150" y="400" class="rod" text-anchor="middle">PYJUTSU · PYTHON PARA OSINT</text>
